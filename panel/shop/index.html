<!DOCTYPE html>
<html lang="fr" dir="ltr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TounsiBet | Shop Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tRed: '#E70012',        
                        tRedDark: '#b3000e',    
                        tGreyBase: '#121316',   
                        tGreyCard: '#1a1c23',   
                        neonGreen: '#00ff87', 
                    },
                    fontFamily: {
                        space: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #121316 !important;
            color: #ffffff !important;
            font-family: 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* خلفية الأورورا السائلة */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background: #121316;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
            animation: floatOrb 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #E70012; top: -10%; left: -10%; }
        .orb-2 { width: 500px; height: 500px; background: #00ff87; bottom: -20%; right: -10%; animation-delay: -5s; opacity: 0.08; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 80px) scale(1.1); }
        }

        /* مكونات التصميم الزجاجي */
        .glass-panel {
            background: rgba(26, 28, 35, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .menu-btn {
            background: rgba(18, 19, 22, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ffffff;
            width: 100%; text-align: left;
            padding: 12px 16px;
            border-radius: 0.75rem; margin-bottom: 8px;
            font-size: 14px; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
        }
        .menu-btn:hover, .menu-btn:active {
            background: rgba(231, 0, 18, 0.1);
            border-color: rgba(231, 0, 18, 0.3);
            transform: translateX(2px);
        }

        .tb-input {
            background-color: rgba(18, 19, 22, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white; width: 100%; padding: 12px 14px;
            border-radius: 0.75rem; margin-bottom: 12px; outline: none;
            transition: all 0.3s ease; font-family: 'JetBrains Mono', monospace;
        }
        .tb-input:focus {
            border-color: #E70012 !important;
            box-shadow: 0 0 0 2px rgba(231, 0, 18, 0.2) !important;
        }

        .btn-red-glow {
            background: linear-gradient(145deg, #E70012, #b3000e);
            color: white; font-weight: 900; width: 100%;
            padding: 12px; font-size: 14px; text-transform: uppercase; tracking: widest;
            border-radius: 0.75rem; border: none; margin-top: 8px;
            box-shadow: 0 4px 15px rgba(231, 0, 18, 0.4); transition: all 0.2s;
        }
        .btn-red-glow:hover { box-shadow: 0 6px 20px rgba(231, 0, 18, 0.6); transform: translateY(-1px); }

        ::-webkit-scrollbar { display: none; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden relative">

    <!-- الخلفية السائلة -->
    <div class="aurora-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div id="toast-container" class="flex flex-col gap-2"></div>

    <!-- الهيدر العلوي -->
    <div class="glass-panel rounded-none border-t-0 border-x-0 border-b border-white/10 text-white px-4 py-3 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-3">
            <button id="back-btn" class="hidden w-8 h-8 flex items-center justify-center bg-white/5 hover:bg-white/10 rounded-full transition" onclick="showView('menu-view')">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <span id="header-title" class="font-black tracking-widest uppercase text-sm flex items-center gap-2">
                <i class="fas fa-store text-tRed"></i> SHOP PANEL
            </span>
        </div>
        <button class="w-8 h-8 flex items-center justify-center bg-white/5 hover:bg-tRed hover:text-white rounded-full transition text-gray-400" onclick="showView('menu-view')">
            <i class="fa-solid fa-house text-sm"></i>
        </button>
    </div>

    <!-- معلومات الوكيل (Shop) -->
    <div class="bg-tGreyCard/80 backdrop-blur-md border-b border-tRed/30 px-4 py-3 flex justify-between items-center shadow-md z-10 relative overflow-hidden">
        <div class="absolute right-0 top-0 w-32 h-32 bg-tRed/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
        <div class="relative z-10">
            <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-0.5">Connecté en tant que</div>
            <div class="font-black uppercase tracking-wide text-sm text-white flex items-center gap-2">
                <i class="fas fa-user-tie text-tRed"></i> <span id="shop-username-display">SHOP_NAME (ID: ---)</span>
            </div>
        </div>
        <div class="text-right relative z-10">
            <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-0.5">Solde Caisse</div>
            <div class="font-black font-mono text-neonGreen text-lg tracking-wider" id="shop-balance-display">0.00 TND</div>
        </div>
    </div>

    <!-- الحاوية الرئيسية للتنقل -->
    <div class="flex-1 overflow-y-auto p-4 z-10" id="main-container">

        <!-- واجهة القائمة الرئيسية -->
        <div id="menu-view" class="animate-fade-in pb-20">
            
            <div class="text-tRed font-black text-[10px] uppercase tracking-widest mb-3 ml-1 flex items-center gap-2">
                <i class="fas fa-users-cog"></i> Gestion des Joueurs
            </div>
            <div class="glass-panel p-2 mb-6">
                <button class="menu-btn" onclick="showView('new-user-view')">
                    <span class="flex items-center gap-3"><i class="fas fa-user-plus text-gray-400 w-4"></i> Nouvel Utilisateur</span>
                    <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
                </button>
                <button class="menu-btn" onclick="fetchAndShowBalances()">
                    <span class="flex items-center gap-3"><i class="fas fa-wallet text-gray-400 w-4"></i> Gérer les Soldes</span>
                    <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
                </button>
                <button class="menu-btn" onclick="fetchAndShowTree()">
                    <span class="flex items-center gap-3"><i class="fas fa-sitemap text-gray-400 w-4"></i> Liste (Arbre)</span>
                    <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
                </button>
            </div>

            <div class="text-blue-400 font-black text-[10px] uppercase tracking-widest mb-3 ml-1 flex items-center gap-2">
                <i class="fas fa-chart-line"></i> Historique & Rapports
            </div>
            <div class="glass-panel p-2 mb-6">
                <button class="menu-btn" onclick="fetchAndShowTransactions()">
                    <span class="flex items-center gap-3"><i class="fas fa-exchange-alt text-gray-400 w-4"></i> Transferts Caisse</span>
                    <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
                </button>
                <button class="menu-btn" onclick="fetchAndShowNetHistory()">
                    <span class="flex items-center gap-3"><i class="fas fa-balance-scale text-gray-400 w-4"></i> Bilan Net (Joueurs)</span>
                    <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
                </button>
                <button class="menu-btn" onclick="fetchAndShowSportTickets()">
                    <span class="flex items-center gap-3"><i class="fas fa-futbol text-gray-400 w-4"></i> Historique Sportif</span>
                    <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
                </button>
                <button class="menu-btn" onclick="fetchAndShowCasinoHistory()">
                    <span class="flex items-center gap-3"><i class="fas fa-dice text-gray-400 w-4"></i> Historique Casino</span>
                    <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
                </button>
            </div>
        </div>

        <!-- تذييل القائمة الرئيسية -->
        <div id="menu-footer" class="animate-fade-in absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-tGreyBase via-tGreyBase to-transparent z-20 pointer-events-none">
            <div class="glass-panel p-2 flex justify-between pointer-events-auto shadow-2xl border-tRed/20">
                <button class="flex-1 flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition" onclick="showView('password-view')">
                    <i class="fa-solid fa-lock mb-1"></i>
                    <span class="text-[9px] font-bold uppercase">Sécurité</span>
                </button>
                <button class="flex-1 flex flex-col items-center justify-center p-2 text-gray-400 hover:text-white transition border-l border-white/5" onclick="changeLanguage('en')">
                    <i class="fa-solid fa-globe mb-1"></i>
                    <span class="text-[9px] font-bold uppercase">Langue</span>
                </button>
                <button class="flex-1 flex flex-col items-center justify-center p-2 text-tRed hover:text-white hover:bg-tRed/10 rounded-lg transition border-l border-white/5" onclick="logoutShop()">
                    <i class="fa-solid fa-power-off mb-1"></i>
                    <span class="text-[9px] font-bold uppercase">Quitter</span>
                </button>
            </div>
        </div>

        <!-- واجهة: مستخدم جديد -->
        <div id="new-user-view" class="hidden animate-fade-in">
            <div class="glass-panel p-4 border-t-4 border-t-tRed">
                <div class="mb-4">
                    <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2 ml-1">Nom d'utilisateur</label>
                    <input type="text" id="new-username" class="tb-input text-center" placeholder="Ex: joueur123">
                </div>

                <div class="mb-4 relative">
                    <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2 ml-1">Mot de passe</label>
                    <input type="password" id="new-password" class="tb-input text-center pr-10" placeholder="Mot de passe secret">
                    <button class="absolute right-4 top-9 text-gray-400 hover:text-white" onclick="togglePassword('new-password')">
                        <i class="fa-regular fa-eye-slash"></i>
                    </button>
                </div>

                <button class="w-full bg-white/5 border border-white/10 hover:bg-white/10 text-white font-bold py-2 rounded-xl mb-4 text-xs transition" onclick="generatePassword()">
                    <i class="fas fa-random mr-2"></i> Générer un mot de passe
                </button>

                <div class="mb-4 bg-black/30 p-3 rounded-xl border border-white/5 mt-2">
                    <label class="block text-white font-bold text-xs uppercase tracking-widest mb-2 text-center">Dépôt Initial (Optionnel)</label>
                    <div class="flex items-center justify-center gap-2">
                        <input type="number" id="new-balance" class="tb-input mb-0 text-center text-neonGreen font-black text-lg bg-transparent border-0 border-b-2 rounded-none" value="0.00" step="0.10" style="width: 150px;">
                        <span class="text-gray-400 font-bold">TND</span>
                    </div>
                </div>

                <button class="btn-red-glow" id="btn-create-user" onclick="createPlayerAccount()"><i class="fas fa-plus-circle mr-2"></i> Créer le compte</button>
            </div>
        </div>

        <!-- واجهة: إدارة الأرصدة -->
        <div id="balances-view" class="hidden animate-fade-in flex flex-col h-full pb-10">
            <div class="flex gap-2 mb-4">
                <div class="relative w-full">
                    <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-500"></i>
                    <input type="text" id="search-users" oninput="filterTable('users-table', this.value)" class="tb-input pl-12 mb-0" placeholder="Rechercher un joueur...">
                </div>
            </div>

            <div class="glass-panel p-0 overflow-hidden flex-1 flex flex-col border-t-4 border-t-blue-500">
                <div class="bg-black/50 px-4 py-3 border-b border-white/5 flex justify-between items-center text-xs">
                    <div class="text-gray-400"><span id="users-count" class="font-bold text-white">0</span> Joueurs</div>
                    <div class="text-gray-400">Total: <span id="total-users-balance" class="font-bold font-mono text-white">0.00</span></div>
                </div>
                
                <div class="overflow-y-auto flex-1 p-2 no-scrollbar" style="max-height: 60vh;">
                    <table class="w-full text-left text-sm" id="users-table">
                        <tbody id="users-tbody" class="flex flex-col gap-2">
                            <!-- يعبأ بالجافاسكريبت -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- واجهة: الشجرة (قائمة المستخدمين) -->
        <div id="tree-view" class="hidden animate-fade-in">
            <div class="glass-panel p-4 mb-4">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-1 ml-1">Pseudo</label>
                        <input type="text" id="tree-search-username" class="tb-input mb-0" placeholder="Pseudo" oninput="filterTree()">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-1 ml-1">ID</label>
                        <input type="text" id="tree-search-id" class="tb-input mb-0" placeholder="ID" oninput="filterTree()">
                    </div>
                </div>
                <button class="w-full bg-white/5 border border-white/10 text-white font-bold py-2 rounded-xl text-xs" onclick="fetchAndShowTree()">Rafraîchir</button>
            </div>
            <div id="tree-list" class="flex flex-col gap-2 pb-10"></div>
        </div>

        <!-- واجهة: سجل التحويلات المالية -->
        <div id="transactions-view" class="hidden animate-fade-in">
            <div class="relative w-full mb-4">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-500"></i>
                <input type="text" id="trans-search-username" class="tb-input pl-12 mb-0" placeholder="Rechercher par pseudo..." oninput="filterTransactions()">
            </div>
            <div id="transactions-list" class="flex flex-col gap-2 pb-10"></div>
        </div>

        <!-- واجهة: البيلان الصافي (Net) -->
        <div id="net-history-view" class="hidden animate-fade-in">
            <div class="relative w-full mb-4">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-500"></i>
                <input type="text" id="net-search-username" class="tb-input pl-12 mb-0" placeholder="Rechercher par pseudo..." oninput="filterNetHistory()">
            </div>
            <div id="net-history-list" class="flex flex-col gap-2 pb-10"></div>
        </div>

        <!-- واجهة: السجل الرياضي -->
        <div id="sport-history-view" class="hidden animate-fade-in">
            <div class="relative w-full mb-4">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-500"></i>
                <input type="text" id="sport-search-username" class="tb-input pl-12 mb-0" placeholder="Rechercher par pseudo..." oninput="filterSportHistory()">
            </div>
            <div id="sport-history-list" class="flex flex-col gap-2 pb-10"></div>
        </div>

        <!-- واجهة: سجل الكازينو -->
        <div id="casino-history-view" class="hidden animate-fade-in">
            <div class="relative w-full mb-4">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-500"></i>
                <input type="text" id="casino-search-username" class="tb-input pl-12 mb-0" placeholder="Rechercher par pseudo..." oninput="filterCasinoHistory()">
            </div>
            <div id="casino-history-list" class="flex flex-col gap-2 pb-10"></div>
        </div>

        <!-- واجهة: تغيير كلمة السر -->
        <div id="password-view" class="hidden animate-fade-in">
            <div class="glass-panel p-4 border-t-4 border-t-gray-400">
                <div class="text-center mb-4"><i class="fas fa-shield-alt text-4xl text-gray-500"></i></div>
                <div class="mb-4">
                    <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2 ml-1 text-center">Nouveau mot de passe Caisse</label>
                    <input type="password" id="new-shop-pass" class="tb-input text-center" placeholder="Entrez le nouveau mot de passe">
                </div>
                <button class="btn-red-glow" onclick="updateShopPassword()"><i class="fas fa-save mr-2"></i> Sauvegarder</button>
            </div>
        </div>

    </div>

    <!-- نافذة منبثقة: إدارة الرصيد (Modal) -->
    <div id="balance-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-[100] p-4">
        <div class="glass-panel w-full max-w-sm p-5 border-t-4 border-t-neonGreen shadow-2xl relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-neonGreen/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3 relative z-10">
                <h3 class="text-white font-black uppercase tracking-widest text-xs flex items-center gap-2"><i class="fas fa-coins text-yellow-500"></i> Opération Financière</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white bg-white/5 w-8 h-8 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="text-center mb-5 relative z-10 bg-black/30 rounded-xl p-3 border border-white/5">
                <div class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Joueur Sélectionné</div>
                <div class="text-white font-mono font-black text-lg" id="modal-username">---</div>
            </div>

            <div class="relative z-10">
                <input type="number" id="modal-amount" class="tb-input text-center text-xl font-black font-mono text-neonGreen py-3" placeholder="0.00 TND">

                <div class="flex gap-2 mt-2 mb-4">
                    <button onclick="processTransaction('charge')" class="flex-1 bg-neonGreen/20 border border-neonGreen/50 text-neonGreen hover:bg-neonGreen hover:text-black font-black py-3 text-xs uppercase tracking-widest rounded-xl transition"><i class="fas fa-arrow-up mr-1"></i> Dépôt</button>
                    <button onclick="processTransaction('withdraw')" class="flex-1 bg-tRed/20 border border-tRed/50 text-tRed hover:bg-tRed hover:text-white font-black py-3 text-xs uppercase tracking-widest rounded-xl transition"><i class="fas fa-arrow-down mr-1"></i> Retrait</button>
                </div>

                <div class="border-t border-white/10 pt-4 mt-2">
                    <label class="block text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-2 text-center">Réinitialiser MDP Joueur (Optionnel)</label>
                    <div class="flex gap-2">
                        <input type="password" id="modal-new-pass" class="tb-input mb-0 text-sm font-mono flex-1" placeholder="Nouveau MDP">
                        <button onclick="changePlayerPasswordFromModal()" class="bg-white/10 hover:bg-white/20 text-white font-bold px-3 rounded-xl text-xs transition"><i class="fas fa-key"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT (تم الحفاظ عليه بالكامل مع تحديث تصميم الـ UI فقط) -->
    <script>
        const BACKEND_URL = "";
        const token = localStorage.getItem('token');
        let sessionData = localStorage.getItem('alpha_user');
        let user = sessionData ? JSON.parse(sessionData) : null;
       
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        if (!token || !user || user.role !== 'shop') {
            localStorage.clear();
            window.location.href = '/';
        }

        let allUsersCache = [];
        let createdPlayersList = [];
        let selectedPlayer = "";
        let allTransactionsCache = [];
        let allSportTicketsCache = [];
        let allCasinoHistoryCache = [];

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-neonGreen text-lg"></i>' : '<i class="fas fa-exclamation-circle text-tRed text-lg"></i>';
            const borderColor = type === 'success' ? 'border-neonGreen/50' : 'border-tRed/50';

            toast.className = `glass-panel ${borderColor} border-l-4 p-3 flex items-center gap-3 transition-all duration-300 transform translate-y-0 opacity-100 mb-2 shadow-2xl`;
            toast.innerHTML = `${icon} <span class="text-sm font-bold text-white font-mono">${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('shop-username-display').innerText = `${user.username.toUpperCase()} (ID: ${user.id || '---'})`;
            updateTopBalance(user.balance);
            await loadShopPlayersData();
        });

        function updateTopBalance(balance) {
            const balNum = parseFloat(balance || 0).toFixed(2);
            document.getElementById('shop-balance-display').innerText = `${balNum} TND`;
        }

        function getAuthHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        function showView(viewId) {
            const views = ['menu-view', 'new-user-view', 'balances-view', 'tree-view', 'password-view', 'transactions-view', 'net-history-view', 'sport-history-view', 'casino-history-view'];
            views.forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');

            const backBtn = document.getElementById('back-btn');
            const menuFooter = document.getElementById('menu-footer');
            const title = document.getElementById('header-title');

            if (viewId === 'menu-view') {
                backBtn.classList.add('hidden');
                menuFooter.classList.remove('hidden');
                title.innerHTML = '<i class="fas fa-store text-tRed"></i> SHOP PANEL';
            } else {
                backBtn.classList.remove('hidden');
                menuFooter.classList.add('hidden');
                let titleText = viewId.replace('-view', '').replace(/-/g, ' ').toUpperCase();

        function generatePassword() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let pass = "";
            for (let i = 0; i < 8; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('new-password').value = pass;
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        async function loadShopPlayersData() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/users`, { headers: getAuthHeaders() });
                if (res.ok) {
                    allUsersCache = await res.json();
                    createdPlayersList = allUsersCache.filter(u => u.created_by === user.username && u.role === 'player');

                    const me = allUsersCache.find(u => u.username === user.username);
                    if (me) {
                        user.balance = me.balance;
                        updateTopBalance(user.balance);
                        localStorage.setItem('alpha_user', JSON.stringify(user));
                    }
                }
            } catch (e) {}
        }

        async function createPlayerAccount() {
            const username = document.getElementById('new-username').value.trim().toLowerCase();
            const password = document.getElementById('new-password').value;
            const initialBalance = parseFloat(document.getElementById('new-balance').value) || 0;
            const btn = document.getElementById('btn-create-user');

            if (!username || !password) return showNotification("Veuillez remplir les champs", "error");

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création...';
            btn.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ username, password, role: 'player', created_by: user.username, phone: "00000000" })
                });
                const data = await res.json();

                if (res.ok) {
                    showNotification("Compte créé avec succès!");
                    if (initialBalance > 0) {
                        await fetch(`${BACKEND_URL}/api/admin/update-balance`, {
                            method: 'POST', headers: getAuthHeaders(),
                            body: JSON.stringify({ admin_username: user.username, target_username: username, action: 'charge', amount: initialBalance })
                        });
                        showNotification(`Solde initial ${initialBalance} TND ajouté`);
                    }
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    document.getElementById('new-balance').value = '0.00';
                    await loadShopPlayersData();
                } else { showNotification(data.detail || "Erreur", "error"); }
            } catch (e) { showNotification("Erreur de connexion", "error"); } 
            finally {
                btn.innerHTML = '<i class="fas fa-plus-circle mr-2"></i> Créer le compte';
                btn.disabled = false;
            }
        }

        async function fetchAndShowBalances() {
            showView('balances-view');
            await loadShopPlayersData();
            renderUsersTable(createdPlayersList);
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('users-tbody');
            document.getElementById('users-count').innerText = users.length;
            let totalBal = 0;
            let html = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr class="w-full"><td class="text-center py-6 text-gray-500 font-bold text-xs uppercase tracking-widest w-full">Aucun joueur</td></tr>';
                document.getElementById('total-users-balance').innerText = "0.00";
                return;
            }

            users.forEach(u => {
                const bal = parseFloat(u.balance || 0);
                totalBal += bal;
                html += `
                <tr class="flex justify-between items-center bg-tGreyBase border border-white/5 rounded-xl p-3 w-full hover:border-white/20 transition cursor-pointer" onclick="openBalanceModal('${escapeHTML(u.username)}')">
                    <div>
                        <div class="font-bold text-white text-sm mb-0.5"><i class="fas fa-user text-gray-500 text-[10px] mr-1"></i> ${escapeHTML(u.username)}</div>

        function openBalanceModal(username) {
            selectedPlayer = username;
            document.getElementById('modal-username').innerText = username;
            document.getElementById('modal-amount').value = '';
            document.getElementById('modal-new-pass').value = '';
            document.getElementById('balance-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('balance-modal').classList.add('hidden'); }

        async function processTransaction(action) {
            const amount = parseFloat(document.getElementById('modal-amount').value);
            if (!amount || amount <= 0) return showNotification("Montant invalide", "error");
            if (action === 'charge' && user.balance < amount) return showNotification('Solde caisse insuffisant!', 'error');

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/update-balance`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ admin_username: user.username, target_username: selectedPlayer, action, amount })
                });
                const data = await res.json();
                if (res.ok) {
                    showNotification("Transaction validée!");
                    closeModal();
                    await fetchAndShowBalances();
                } else { showNotification(data.detail || "Erreur", "error"); }
            } catch (e) { showNotification("Erreur serveur", "error"); }
        }

        async function changePlayerPasswordFromModal() {
            const newPassword = document.getElementById('modal-new-pass').value;
            if (!newPassword || newPassword.length < 4) return showNotification('Mot de passe trop court', 'error');

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/change-player-password`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ admin_username: user.username, target_username: selectedPlayer, new_password: newPassword })
                });
                if (res.ok) {
                    showNotification(`Mot de passe modifié avec succès!`);
                    document.getElementById('modal-new-pass').value = '';
                } else showNotification('Erreur', 'error');
            } catch (e) { showNotification('Erreur de connexion', 'error'); }
        }

        async function fetchAndShowNetHistory() {
            showView('net-history-view');
            const container = document.getElementById('net-history-list');
            container.innerHTML = '<div class="text-center py-6 text-gray-500 font-bold text-xs uppercase tracking-widest animate-pulse">Calcul du bilan...</div>';
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/transactions-history?username=${user.username}`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const txs = await res.json();
                    let userStats = {};
                    txs.forEach(t => {
                        const target = t.target_username;
                        if (!target) return;
                        if (!userStats[target]) userStats[target] = { deposit: 0, withdraw: 0 };
                        const amt = parseFloat(t.amount) || 0;
                        if (t.action === 'charge' || t.action === 'deposit_request') userStats[target].deposit += amt;
                        else if (t.action === 'withdraw') userStats[target].withdraw += amt;
                    });
                    let statsArray = [];
                    for (let username in userStats) {
                        statsArray.push({
                            username: username, deposit: userStats[username].deposit,
                            withdraw: userStats[username].withdraw, net: userStats[username].deposit - userStats[username].withdraw
                        });
                    }
                    window._currentNetStats = statsArray;
                    renderNetHistory(statsArray);
                } else container.innerHTML = '<div class="text-center py-4 text-tRed">Erreur</div>';
            } catch (e) { container.innerHTML = '<div class="text-center py-4 text-tRed">Erreur de connexion</div>'; }
        }

            const container = document.getElementById('net-history-list');
            if (stats.length === 0) {
                container.innerHTML = '<div class="text-center py-6 text-gray-500 font-bold text-xs uppercase tracking-widest">Aucune donnée</div>';
                return;
            }
            let html = '';
            stats.forEach(s => {
                const netColor = s.net >= 0 ? 'text-neonGreen' : 'text-tRed';
                html += `
                <div class="glass-panel p-4 mb-2">
                     <div class="font-bold text-white text-sm mb-3 border-b border-white/10 pb-2"><i class="fas fa-user text-gray-500 mr-2 text-xs"></i> ${escapeHTML(s.username)}</div>
                     <div class="flex justify-between text-xs mb-2">

                         <span class="text-white font-mono font-bold">${s.deposit.toFixed(2)} TND</span>
                     </div>
                     <div class="flex justify-between text-xs mb-3">
                         <span class="text-gray-400 font-bold uppercase tracking-widest text-[10px]">Total Retraits:</span>
                         <span class="text-white font-mono font-bold">${s.withdraw.toFixed(2)} TND</span>
                     </div>
                     <div class="flex justify-between text-sm font-bold bg-black/30 p-2 rounded-lg border border-white/5">
                         <span class="text-gray-300 font-bold uppercase tracking-widest text-[10px] mt-1">Bilan Net:</span>
                         <span class="font-mono font-black text-lg ${netColor}">${s.net.toFixed(2)} TND</span>
                     </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        async function updateShopPassword() {
            const newPass = document.getElementById('new-shop-pass').value;
            if (!newPass || newPass.length < 6) return showNotification('6 caractères minimum', 'error');

            try {
                const res = await fetch(`${BACKEND_URL}/api/user/change-password`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ username: user.username, new_password: newPass })
                });
                if (res.ok) {
                    showNotification('Mot de passe mis à jour!', 'success');
                    document.getElementById('new-shop-pass').value = '';
                } else {
                    const data = await res.json();
                    showNotification(data.detail || 'Erreur', 'error');
                }
            } catch (e) { showNotification('Erreur réseau', 'error'); }
        }

        function changeLanguage(lang) {
            if (lang === 'en') showNotification("Traduction anglaise en cours de développement.", "error");
        }

        function logoutShop() {
            localStorage.clear();
            window.location.href = '/';
        }

        let idleTime = 0;
        function timerIncrement() {
            idleTime = idleTime + 1;
            if (idleTime > 15) {
                showNotification("Déconnexion automatique...", "error");
                setTimeout(logoutShop, 1500);
            }
        }
        document.body.addEventListener('mousemove', () => idleTime = 0);
        document.body.addEventListener('keypress', () => idleTime = 0);
        setInterval(timerIncrement, 60000);
        document.addEventListener('contextmenu', event => event.preventDefault());

    </script>
