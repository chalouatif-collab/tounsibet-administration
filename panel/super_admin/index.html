    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tRed: '#E70012',        
                        tGreyBase: '#121316',

                        space: ['Space Grotesk', 'sans-serif'],

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #121316;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* خلفية الأورورا السائلة باللمسة الذهبية */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background: #121316;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
            animation: floatOrb 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: #E70012; top: -20%; left: -10%; opacity: 0.1; }
        .orb-2 { width: 600px; height: 600px; background: #f59e0b; bottom: -20%; right: -10%; animation-delay: -5s; opacity: 0.15; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 90px) scale(1.1); }
        }

        /* التصميم الزجاجي */
        .glass-panel {
            background: rgba(26, 28, 35, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .tb-input {
            background-color: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border-radius: 0.5rem; padding: 0.5rem 0.75rem;
            font-size: 0.8rem; font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }
        .tb-input:focus {
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2) !important;
        }

        .btn-gold-glow {
            background: linear-gradient(145deg, #f59e0b, #d97706);
            color: #000; font-weight: 900; border: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: all 0.3s ease;
        }
        .btn-gold-glow:hover {
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
            transform: translateY(-1px); color: #000;
        }

        .sidebar-link-mini {
            color: #9ca3af; padding: 0.6rem 1rem;
            border-radius: 0.5rem; margin-bottom: 0.5rem;
            display: flex; align-items: center; gap: 0.75rem;
            text-decoration: none; font-size: 0.85rem; font-weight: 700;
            transition: all 0.2s; border: 1px solid transparent; background: rgba(0,0,0,0.2);
            width: 100%; text-align: left;
        }
        .sidebar-link-mini:hover {
            background: rgba(245, 158, 11, 0.1);
            color: white; border-color: rgba(245, 158, 11, 0.3);
        }

        .active-shop-btn {
            background-color: rgba(245, 158, 11, 0.15) !important;
            border-color: #f59e0b !important;
            color: #f59e0b !important;
        }

        .offcanvas, .modal-content {
            background: rgba(26, 28, 35, 0.95) !important;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type=range] { accent-color: #f59e0b; }
    </style>
</head>

    <!-- MAIN JAVASCRIPT (تم الحفاظ عليه بالكامل 100%) -->
    <script>
        const BACKEND_URL = "";
        
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/'; 

        let user = JSON.parse(localStorage.getItem('alpha_user'));
        if (!user || user.role !== 'owner' && user.role !== 'super_admin') {
            localStorage.clear();
            window.location.href = '/'; 
        }

        let allAdmins = [];
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function getAuthHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        window.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('owner-username');
            if(el) el.innerText = user.username;
            loadNetworkData();
        });

        const translations = {
            fr: { menu: "Gestion Super Admin", create: "Créer un compte réseau", console: "Console financière", credit: "Créditer", retirer: "Retirer", out: "Déconnexion" },
            en: { menu: "Super Admin Core", create: "Create Network Account", console: "Financial Console", credit: "Charge", retirer: "Withdraw", out: "Logout" }
        };

        function changeLanguage(lang) {
            document.documentElement.dir = 'ltr';
            document.getElementById('menu-title').innerHTML = `<i class="fas fa-crown mr-1"></i> ${translations[lang].menu}`;
            document.getElementById('title-create-user').innerHTML = `<i class="fas fa-user-plus mr-2"></i> ${translations[lang].create}`;
            document.getElementById('title-table-console').innerHTML = `<i class="fas fa-money-check-alt mr-2"></i> ${translations[lang].console}`;
            document.getElementById('btn-credit').innerHTML = `<i class="fas fa-arrow-up mr-1"></i> ${translations[lang].credit}`;
            document.getElementById('btn-retirer').innerHTML = `<i class="fas fa-arrow-down mr-1"></i> ${translations[lang].retirer}`;
            document.querySelectorAll('#btn-logout').forEach(btn => btn.innerHTML = `🚪 ${translations[lang].out}`);
        }

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toastEl = document.createElement('div');
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-neonGreen text-lg"></i>' : '<i class="fas fa-exclamation-circle text-tRed text-lg"></i>';
            const borderColor = type === 'success' ? 'border-neonGreen/50' : 'border-tRed/50';

        async function loadNetworkData() {
            try {
                const uRes = await fetch(`${BACKEND_URL}/api/admin/users`, { method: 'GET', headers: getAuthHeaders() });
                
                if (uRes.status === 401 || uRes.status === 403) {
                    showNotification('Session expirée...', 'error');
                    setTimeout(logout, 1500);
                    return;
                }

                if(uRes.ok){
                    const users = await uRes.json();
                    const me = users.find(u => u.username === user.username);
                    if(me) {
                        user.balance = me.balance;
                        document.getElementById('sadmin-balance-val').innerText = `${parseFloat(user.balance).toFixed(2)} TND`;
                        localStorage.setItem('alpha_user', JSON.stringify(user));
                    }
                    allAdmins = users.filter(u => u.role === 'admin' || u.role === 'manager' || u.role === 'super_admin');
                    renderAdminsList(allAdmins);
                }
            } catch(e){
                document.getElementById('owner-network-list').innerHTML = `<div class="text-center p-4 text-tRed font-bold uppercase tracking-widest text-[10px]">Erreur de connexion ❌</div>`;
            }
        }

        async function executeAction(action) {
            const target_username = document.getElementById('target-action-user').value;
            const amountInput = document.getElementById('target-action-amount').value;
            const actionBtn = action === 'charge' ? document.getElementById('btn-credit') : document.getElementById('btn-retirer');

            if(!target_username) return showNotification('Sélectionnez un compte depuis le réseau!', 'error');
            const amount = parseFloat(amountInput);
            if(isNaN(amount) || amount <= 0) return showNotification('Montant invalide!', 'error');

            if (actionBtn) { actionBtn.disabled = true; actionBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/update-balance`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ admin_username: user.username, target_username, action, amount })
                });
                if(res.ok) { 
                    showNotification('Opération financière réussie! ✅', 'success'); 
                    document.getElementById('target-action-amount').value = ''; 
                    await loadNetworkData(); 
                } else { showNotification('Erreur système', 'error'); }
            } catch(e) { 
                showNotification('Erreur réseau', 'error'); 
            } finally {
                if (actionBtn) {
                    actionBtn.disabled = false;
                    actionBtn.innerHTML = action === 'charge' ? '<i class="fas fa-arrow-up mr-1"></i> Créditer' : '<i class="fas fa-arrow-down mr-1"></i> Retirer';
                }
            }
        }

        async function createAdminUser() {
            const usernameInput = document.getElementById('new-user-name');
            const passwordInput = document.getElementById('new-user-pass');
            const phoneInput = document.getElementById('new_phone');
            const btnCreate = document.getElementById('btn-create');

            const username = usernameInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const phone = phoneInput ? phoneInput.value.trim() : ''; 

            if(!username || !password) return showNotification('Veuillez remplir tous les champs!', 'error');

            if(btnCreate) { btnCreate.disabled = true; btnCreate.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }

            try {
                const res = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ username, password, role: 'admin', created_by: user.username, phone }) 
                });
                
                const data = await res.json(); 
                if(res.ok){
                    showNotification('Compte réseau créé avec succès!', 'success');
                    usernameInput.value = ''; passwordInput.value = ''; if(phoneInput) phoneInput.value = '';
                    loadNetworkData();
                } else { 
                    showNotification(data.detail || 'Erreur', 'error'); 
                }
            } catch(e) { 
                showNotification('Erreur', 'error'); 
            } finally {
                if(btnCreate) { btnCreate.disabled = false; btnCreate.innerText = 'Créer Compte'; }
            }
        }

        async function saveRtpAndBlock(blockStatus) {
            const target_username = document.getElementById('target-action-user').value;
            let rawRtp = parseInt(document.getElementById('ctrl-rtp-range').value);
            
            if (isNaN(rawRtp)) rawRtp = 50;
            const rtp = Math.max(1, Math.min(99, rawRtp));

            if(!target_username) return showNotification('Sélectionnez un compte d\'abord!', 'error');
            
            const res = await fetch(`${BACKEND_URL}/api/admin/configure-account`, {
                method: 'POST', headers: getAuthHeaders(),
                body: JSON.stringify({ admin_username: user.username, target_username, rtp, is_blocked: blockStatus })
            });
            if(res.ok) { showNotification('Configuration de sécurité enregistrée!'); loadNetworkData(); }
        }

        function applyDateFilter() {
            const startDate = document.getElementById('tx-start-date').value;
            const endDate = document.getElementById('tx-end-date').value;
            let filtered = allTransactionsCache;

            if (startDate || endDate) {
                filtered = allTransactionsCache.filter(t => {
                    const txDate = t.date ? t.date.split(' ')[0] : '';
                    if (!txDate) return false;
                    let isAfterStart = true;
                    let isBeforeEnd = true;
                    if (startDate) isAfterStart = txDate >= startDate;
                    if (endDate) isBeforeEnd = txDate <= endDate;
                    return isAfterStart && isBeforeEnd;
                });
            }
            displayFilteredTransactions(filtered);
        }

            const listContainer = document.getElementById('tx-list-container');

            listContainer.innerHTML = html;

        async function loadSportTickets() {
            const container = document.getElementById('panel-sadmin-sport');

                        const tickets = await ticketsRes.json();
                        tickets.forEach(t => {
                            let badgeColor = t.status === "gagne" ? "bg-neonGreen/20 border-neonGreen/30 text-neonGreen" : (t.status === "perdu" ? "bg-tRed/20 border-tRed/30 text-tRed" : (t.status === "cashout" ? "bg-yellow-500/20 border-yellow-500/30 text-yellow-500" : "bg-blue-400/20 border-blue-400/30 text-blue-400"));
                            
                            let matchesHtml = Array.isArray(t.details_list) ?

                            let safeTarget = escapeHTML(target);

                            allTicketsHtml += `
                                <div class="glass-panel p-4 mb-2 border-l-4 ${t.status === 'gagne' ? 'border-neonGreen' : (t.status === 'perdu' ? 'border-tRed' : 'border-blue-400')}">

                                            <span class="font-bold text-sm"><i class="fas fa-user text-gray-500 text-[10px] mr-1"></i> ${safeTarget}</span>
                                        </div>
                                        <span class="badge border ${badgeColor} py-1 px-2 text-uppercase text-[9px] tracking-widest">${escapeHTML(t.status)}</span>

                                    <div class="text-xs font-mono leading-relaxed mb-3">${matchesHtml}</div>

                                        <div class="text-gray-400 text-[10px]">
                                            Cote: <span class="text-white font-bold">X${parseFloat(t.total_cote).toFixed(2)}</span><br>
                                            Mise: <span class="text-white font-bold">${parseFloat(t.mise).toFixed(2)}</span>
                                        </div>
                                        <div class="${t.status === 'gagne' ? 'text-neonGreen' : 'text-white'} font-black text-right text-lg">
                                            +${parseFloat(t.gain).toFixed(2)}
                                        </div>
                                    </div>
                                </div>`;

                container.innerHTML = '<div class="text-center p-4 text-tRed font-bold">Erreur API</div>';
